<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quotanest — Use less of your AI coding limit</title>
<meta name="description" content="A browser-only workbench for Claude Code and Codex users: token estimates, prompt compression, limit forecast, CLAUDE.md checks. No upload, no AI API calls.">
<meta name="theme-color" content="#0B6E4F">
<meta property="og:title" content="Quotanest">
<meta property="og:description" content="Use less of your AI coding limit. Runs in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://quotanest.pages.dev/">

<link rel="icon" href="icon.svg" type="image/svg+xml">

</head>
<body>
<header class="site">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect class="m-bg" width="64" height="64" rx="14"/><rect class="m-bar" x="14" y="18" width="36" height="6" rx="3"/><rect class="m-bar" x="14" y="30" width="22" height="6" rx="3" opacity="0.55"/><rect class="m-bar" x="14" y="42" width="30" height="6" rx="3" opacity="0.85"/></svg><span data-t="brand">Quotanest</span></a>
  <div class="hdr">
    <label class="sr" for="lang" data-t="set_lang">Language</label>
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option><option value="zh">中文</option><option value="es">Español</option>
    </select>
    <a class="btn small" href="app/" data-t="nav_app">Open the app</a>
  </div>
</header>
<main>
  <section class="hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <h1 data-t="hero_title">Use less of your AI coding limit.</h1>
        <p class="lead" data-t="hero_sub"></p>
        <div class="cta">
          <a class="btn" href="app/" data-t="cta_open">Open the app</a>
          <span class="price" data-t="cta_price"></span>
        </div>
      </div>
      <figure class="shot" aria-hidden="true">
        <div class="shot-bar"><span></span><span></span><span></span></div>
        <div class="shot-body">
          <div class="shot-row"><span data-t="mock_block">Five-hour block</span><b>62%</b></div>
          <div class="meter"><i style="width:62%"></i></div>
          <div class="shot-hint" data-t="mock_reset">Resets in 2 h 14 min</div>
          <div class="shot-row shot-sep"><span data-t="mock_week">This week</span><b>38%</b></div>
          <div class="days">
            <i style="height:30%"></i><i style="height:55%"></i><i style="height:22%"></i><i style="height:70%"></i><i style="height:46%"></i><i style="height:88%"></i><i style="height:40%"></i>
          </div>
          <div class="shot-cut">
            <div class="shot-row"><span data-t="mock_saved">Saved by compressing</span><b>-31%</b></div>
            <div class="meter thin"><i style="width:31%"></i></div>
          </div>
        </div>
      </figure>
    </div>
  </section>
  <section class="grid" aria-label="Features">
    <article><h2 data-t="f1_t"></h2><p data-t="f1_b"></p></article>
    <article><h2 data-t="f2_t"></h2><p data-t="f2_b"></p></article>
    <article><h2 data-t="f3_t"></h2><p data-t="f3_b"></p></article>
    <article><h2 data-t="f4_t"></h2><p data-t="f4_b"></p></article>
  </section>
  <section class="how">
    <h2 data-t="how_t"></h2>
    <ol>
      <li data-t="how_1"></li>
      <li data-t="how_2"></li>
      <li data-t="how_3"></li>
    </ol>
  </section>
  <section class="faq">
    <h2 data-t="faq_t"></h2>
    <details><summary data-t="faq_q1"></summary><p data-t="faq_a1"></p></details>
    <details><summary data-t="faq_q2"></summary><p data-t="faq_a2"></p></details>
    <details><summary data-t="faq_q3"></summary><p data-t="faq_a3"></p></details>
  </section>
  <p class="nonaff" data-t="nonaff"></p>
</main>
<footer class="site">

</html>
